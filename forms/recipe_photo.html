---
layout: page
title: Submit an Image of a Recipe
---
{%- assign docs = site.book_recipes | sort: "title" -%}
<form action="{{page.url}}" method="POST" rel="nofollow" enctype="multipart/form-data"></form>
    <div style="display:flex">
        <span style="margin-right: 10px">
            <div style="text-align: left">Current Image</div>
            <div>{%- include img.html type="recipe_photos" id="$$RECIPE_PAGE/RECIPE_NAME$$" width="395" htmlid="old" -%}</div>
        </span>
        <span style="text-align: right">
            <div >Your Submission</div>
            <div><img id="new" width="395px"/></div>
            <div>
                <label for="photo">Select a photo (Sorry, only JPEGs supported)</label>
                <input type="file" name="photo" id="photo" accept=".jpg,.jpeg" onchange="updateNew(event)"/>
            </div>
    </div>
    <div>
        <label for="name">Your Name:</label>
        <input type="text" name="name" id="name"/>
    </div>
    <div>
        <label for="email">Your Email Address:</label>
        <input type="email" name="email" id="email"/>
    </div>
    <div>
        <label for="recipe">Recipe</label>
        <select name="recipe" onchange="updateCurrent(event)">
            <option value="">--Please select a recipe--</option>
            {% for recipe in docs %}
                <option value="{{recipe.recipe}}">{{recipe.title}}</option>
            {% endfor %}
        </select>
    </div>
    <input type="submit" value="Submit Photo" />
</form>
<script>
    var updateCurrent = function(event) {
        var currentImage = document.getElementById('old');
        currentImage.src = new URL("../" + event.target.value + ".jpg", currentImage.src );
    };

    var updateNew = function(event) {
        var newImage = document.getElementById('new');
        newImage.src = URL.createObjectURL(event.target.files[0]);
        newImage.onload = function() {
            URL.revokeObjectURL(newImage.src); // don't leak memory
        };
    };
</script>
