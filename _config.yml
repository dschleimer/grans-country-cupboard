# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Gran's Country Cupboard
author:
  name: David Schleimer
  email: dschleimer@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  This is a digitization of my great grandmother's cookbook.
  The original was written by Elizabeth M. McGinley some time before
  I was born.  I hope that making the recipes herein easier to read and
  search will lead to them seeing more use.
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  dschleimer
repository: dschleimer/grans-country-cupboard
github:
  source:
    branch: main

turnstile_site_key: 0x4AAAAAAByHF4Zttbf5zPk1

# Build settings
# I really wanted a custom-head.html include that wasn't available in the latest release, hence the commit hash
remote_theme: jekyll/minima@b3385fe
plugins:
  - jekyll-relative-links
  - jekyll-sitemap
  - jekyll-titles-from-headings
  - jekyll-remote-theme
  - jekyll-github-metadata


titles_from_headings:
  collections: true
  strip_title: true

collections:
  book_recipes:
    output: true
  book_pages:
    output: true
    # order takes priority over sort_by
    # so this ends up going cover, title, 001, 002, ...
    sort_by: number
    order:
      - cover.md
      - title.md
  book_chapters:
    output: true
    sort_by: number
  ingredients:
    output: true
  categories:
    output: true

minima:
  skin: auto
  nav_pages:
    - book_chapters/index.md
    - book_pages/index.md
    - book_recipes/index.md
    - categories/index.md
    - ingredients/index.md
    - about.markdown
  social_links:
    - title: Gran's Country Cupboard on Github
      url: https://github.com/dschleimer/grans-country-cupboard
      icon: github

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
exclude:
  - .wrangler/
  - package-lock.json
  - package.json
  - wrangler.toml
  - node_modules/
  - .recipe_stats/
