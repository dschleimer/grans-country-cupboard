# Ingredient Mappings
#
# Maps raw ingredient strings (as they appear in recipe tables) to canonical
# names from the taxonomy (_data/ingredient_taxonomy.yml).
#
# Lookup is case-insensitive. Only entries that differ from their canonical
# form need to be listed here — ingredients that already match a canonical
# name (case-insensitive) are resolved automatically.
#
# Categories of mappings:
#   - Synonyms: different names for the same thing
#   - Plurals: irregular singular/plural normalization
#   - Brands: brand names -> generic canonical
#   - Variants: specific forms -> canonical name
#
# NOT listed here (handled automatically by the plugin):
#   - Standard English plurals (trailing -s/-es)
#   - Modifier prefix/suffix stripping (Grated, Chopped, etc.)
#   - Case normalization

