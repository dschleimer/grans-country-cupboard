# Ingredient Taxonomy
#
# Structure: Aisle -> Ingredient -> Variation (variations can nest)
# see_also: cross-references for ingredients that span categories
#
# Rules for primary vs. see_also:
#   1. What animal/plant is it from? -> Primary parent
#   2. What part of the animal? -> Variation of the animal
#   3. What preparation/form? -> Further variation OR see_also
#   Permanent attributes are primary; processing is see_also.
#
# All members and variations are sorted alphabetically within each section.

