# Ingredient modifiers — preparation words stripped during normalization.
# Shared by _plugins/ingredients.rb and _tools/fix_ingredients.py.
# Alpha-sorted here; consumers sort longest-first at load time.
#
# The resolution chain checks taxonomy variants and explicit mappings
# BEFORE modifier stripping, so words that also appear as taxonomy
# variant prefixes (e.g., "Ground", "Whole", "Dry") are safe here —
# taxonomy matches take priority.
#
# Excluded (identity-changers / meta-instructions):
#   Juiced   — changes identity ("Juiced Lemon" = lemon juice)
#   Divided  — portioning instruction, not preparation

