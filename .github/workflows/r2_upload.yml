name: Upload assets to R2

on:
  push:
    branches:
      - main
    paths:
      - assets/**
      - .github/workflows/r2_upload.yml

jobs:

  r2_upload_original:
    name: R2 Upload Full Res Original
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: assets/full_res/original
        
      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: |
            [r2]
            type = s3
            provider = Cloudflare
            region = auto
            env_auth = true
          disable_base64: true

      - run: rclone sync --verbose assets/full_res/original/ r2:gran-assets/original/
        env:
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com/


